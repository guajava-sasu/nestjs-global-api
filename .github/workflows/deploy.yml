name: CI and production deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to production after CI passes
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: nestjs-global-api-production
  cancel-in-progress: false

jobs:
  ci:
    name: Verify and package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check manifest and lockfile consistency
        run: node scripts/verify-lockfile.mjs

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify compiled ESM entry point
        run: |
          test -s dist/main.js
          node --check dist/main.js
          node -e "if (require('./package.json').type !== 'module') process.exit(1)"

      - name: Prepare versioned production artifact
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp -R dist package.json package-lock.json artifact/
          if [[ -d public ]]; then cp -R public artifact/; fi
          npm ci --omit=dev --prefix artifact
          test -s artifact/node_modules/.package-lock.json
          archive="nestjs-global-api-${RELEASE_VERSION}.tar.gz"
          archive_items=(package.json package-lock.json dist node_modules)
          if [[ -d artifact/public ]]; then archive_items+=(public); fi
          tar -czf "$archive" -C artifact "${archive_items[@]}"
          tar -tzf "$archive" > archive-entries.txt
          awk '
            NF == 0 || $0 == "." || $0 ~ /^\// || $0 ~ /(^|\/)\.\.(\/|$)/ { exit 1 }
            { path=$0; sub(/\/$/, "", path); split(path, part, "/")
              if (part[1] !~ /^(package\.json|package-lock\.json|dist|node_modules|public)$/) exit 1
            }
          ' archive-entries.txt
          grep -Fxq 'package.json' archive-entries.txt
          grep -Fxq 'package-lock.json' archive-entries.txt
          grep -Fxq 'dist/main.js' archive-entries.txt
          grep -Fxq 'node_modules/.package-lock.json' archive-entries.txt
          sha256sum "$archive" > "${archive}.sha256"
          printf 'RELEASE_VERSION=%s\n' "$RELEASE_VERSION" >> "$GITHUB_ENV"
          printf 'RELEASE_ARCHIVE=%s\n' "$archive" >> "$GITHUB_ENV"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: nestjs-global-api-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            nestjs-global-api-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz
            nestjs-global-api-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy versioned release
    needs: ci
    if: >-
      ${{
        needs.ci.result == 'success' &&
        ((github.event_name == 'workflow_dispatch' && inputs.deploy == true) ||
         (github.event_name == 'push' && vars.GLOBAL_AUTO_DEPLOY_ENABLED == 'true'))
      }}
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Download CI artifact
        uses: actions/download-artifact@v4
        with:
          name: nestjs-global-api-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifact

      - name: Validate VPS contract and credentials
        shell: bash
        env:
          VPS_HOST: ${{ secrets.GLOBAL_VPS_HOST }}
          VPS_USER: ${{ secrets.GLOBAL_VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.GLOBAL_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.GLOBAL_VPS_KNOWN_HOSTS }}
          VPS_SSH_PORT: ${{ vars.GLOBAL_VPS_SSH_PORT }}
          VPS_CONTRACT_CONFIRMED: ${{ vars.GLOBAL_VPS_CONTRACT_CONFIRMED }}
          ROLLBACK_CONFIRMED: ${{ vars.GLOBAL_ROLLBACK_CONFIRMED }}
          MONGODB_VALIDATED: ${{ vars.GLOBAL_MONGODB_VALIDATED }}
          VPS_AUTO_DEPLOY_ENABLED: ${{ vars.GLOBAL_AUTO_DEPLOY_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_DEPLOY: ${{ inputs.deploy }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS VPS_SSH_PORT VPS_CONTRACT_CONFIRMED ROLLBACK_CONFIRMED MONGODB_VALIDATED; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing GitHub secret/variable: $name"; exit 1; fi
          done
          [[ "$VPS_CONTRACT_CONFIRMED" == "true" ]] || { echo '::error::VPS execution and artifact contract is not confirmed.'; exit 1; }
          [[ "$ROLLBACK_CONFIRMED" == "true" ]] || { echo '::error::VPS rollback behavior is not confirmed.'; exit 1; }
          [[ "$MONGODB_VALIDATED" == "true" ]] || { echo '::error::MongoDB databases, credentials, and empty initial state are not confirmed.'; exit 1; }
          [[ "$VPS_HOST" == "global.orfevrus-api.com" ]] || { echo '::error::GLOBAL_VPS_HOST must match the confirmed production host.'; exit 1; }
          [[ "$VPS_USER" == "deploy-nestjs-global-api" ]] || { echo '::error::GLOBAL_VPS_USER does not match the deployment account.'; exit 1; }
          [[ "$VPS_SSH_PORT" =~ ^[0-9]{1,5}$ ]] || { echo '::error::GLOBAL_VPS_SSH_PORT is invalid.'; exit 1; }
          ssh_port=$((10#$VPS_SSH_PORT))
          (( ssh_port >= 1 && ssh_port <= 65535 )) || { echo '::error::GLOBAL_VPS_SSH_PORT is invalid.'; exit 1; }
          if [[ "$EVENT_NAME" == "push" ]]; then
            [[ "$VPS_AUTO_DEPLOY_ENABLED" == "true" ]] || { echo '::error::Automatic deployment is not enabled.'; exit 1; }
          elif [[ "$MANUAL_DEPLOY" != "true" ]]; then
            echo '::error::Manual deployment was not requested.'; exit 1
          fi

      - name: Install SSH credentials and verify pinned host entry
        shell: bash
        env:
          VPS_HOST: ${{ secrets.GLOBAL_VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.GLOBAL_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.GLOBAL_VPS_KNOWN_HOSTS }}
          VPS_SSH_PORT: ${{ vars.GLOBAL_VPS_SSH_PORT }}
          VPS_HOST_KEY_FINGERPRINT: SHA256:8kNm9acB4FPL9C7YxG0zyM5DouzK/vaOQthWmm5yqsY
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/global_deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/global_deploy_key" "$HOME/.ssh/known_hosts"
          if [[ "$VPS_SSH_PORT" == "22" ]]; then
            matched_host="$(ssh-keygen -F "$VPS_HOST" -f "$HOME/.ssh/known_hosts" 2>/dev/null)"
          else
            matched_host="$(ssh-keygen -F "[$VPS_HOST]:$VPS_SSH_PORT" -f "$HOME/.ssh/known_hosts" 2>/dev/null)"
          fi
          printf '%s\n' "$matched_host" | awk 'NF >= 3 && $2 ~ /^ssh-ed25519$/ { print $2, $3; found=1; exit } END { if (!found) exit 1 }' > "$HOME/.ssh/verified_host_key.pub"
          actual_fingerprint="$(ssh-keygen -lf "$HOME/.ssh/verified_host_key.pub" -E sha256 | awk '{print $2}')"
          [[ "$actual_fingerprint" == "$VPS_HOST_KEY_FINGERPRINT" ]] || { echo '::error::GLOBAL_VPS_KNOWN_HOSTS host key fingerprint does not match the independently confirmed VPS fingerprint.'; exit 1; }

      - name: Verify restricted SSH command
        shell: bash
        env:
          VPS_HOST: ${{ secrets.GLOBAL_VPS_HOST }}
          VPS_USER: ${{ secrets.GLOBAL_VPS_USER }}
          VPS_SSH_PORT: ${{ vars.GLOBAL_VPS_SSH_PORT }}
          RELEASE_VERSION: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          result="$(ssh -i "$HOME/.ssh/global_deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$VPS_SSH_PORT" "$VPS_USER@$VPS_HOST" ping)"
          [[ "$result" == "nestjs-global-api deployment SSH OK" ]] || { echo '::error::VPS ping response did not match the deployment contract.'; exit 1; }

      - name: Upload and verify versioned release through SSH stdin
        shell: bash
        env:
          VPS_HOST: ${{ secrets.GLOBAL_VPS_HOST }}
          VPS_USER: ${{ secrets.GLOBAL_VPS_USER }}
          VPS_SSH_PORT: ${{ vars.GLOBAL_VPS_SSH_PORT }}
          RELEASE_VERSION: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          archive="release-artifact/nestjs-global-api-${RELEASE_VERSION}.tar.gz"
          checksum="$(sha256sum "$archive" | awk '{print $1}')"
          [[ "$RELEASE_VERSION" =~ ^[A-Fa-f0-9-]+$ ]] || { echo '::error::Invalid release version.'; exit 1; }
          [[ "$checksum" =~ ^[a-f0-9]{64}$ ]] || { echo '::error::Invalid artifact checksum.'; exit 1; }
          cat "$archive" | ssh -i "$HOME/.ssh/global_deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$VPS_SSH_PORT" "$VPS_USER@$VPS_HOST" upload "$RELEASE_VERSION" "$checksum"
          ssh -i "$HOME/.ssh/global_deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$VPS_SSH_PORT" "$VPS_USER@$VPS_HOST" verify "$RELEASE_VERSION" "$checksum"
          printf 'RELEASE_SHA256=%s\n' "$checksum" >> "$GITHUB_ENV"

      - name: Deploy, verify public health, and conditionally roll back
        shell: bash
        env:
          VPS_HOST: ${{ secrets.GLOBAL_VPS_HOST }}
          VPS_USER: ${{ secrets.GLOBAL_VPS_USER }}
          VPS_SSH_PORT: ${{ vars.GLOBAL_VPS_SSH_PORT }}
          RELEASE_VERSION: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_SHA256: ${{ env.RELEASE_SHA256 }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[A-Fa-f0-9-]+$ ]] || { echo '::error::Invalid release version.'; exit 1; }
          [[ "$RELEASE_SHA256" =~ ^[a-f0-9]{64}$ ]] || { echo '::error::Missing or invalid release checksum.'; exit 1; }
          artifact_checksum="$(sha256sum "release-artifact/nestjs-global-api-${RELEASE_VERSION}.tar.gz" | awk '{print $1}')"
          [[ "$RELEASE_SHA256" == "$artifact_checksum" ]] || { echo '::error::Release checksum changed between verify and deploy steps.'; exit 1; }
          if ! deploy_output="$(ssh -i "$HOME/.ssh/global_deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$VPS_SSH_PORT" "$VPS_USER@$VPS_HOST" deploy "$RELEASE_VERSION" "$RELEASE_SHA256" 2>&1)"; then
            echo '::error::VPS deploy command failed; the controller must complete its configured internal rollback.'
            exit 1
          fi
          mapfile -t rollback_tokens < <(printf '%s\n' "$deploy_output" | awk '
            /^ROLLBACK_TOKEN=/ { sub(/^ROLLBACK_TOKEN=/, ""); print; next }
            /^ROLLBACK_TOKEN: / { sub(/^ROLLBACK_TOKEN: /, ""); print; next }
            /^ROLLBACK_TOKEN [^[:space:]]+$/ { sub(/^ROLLBACK_TOKEN /, ""); print }
          ')
          unset deploy_output
          if [[ "${#rollback_tokens[@]}" -ne 1 ]]; then
            echo '::error::VPS deploy succeeded but did not return exactly one rollback token; refusing to report deployment success.'
            exit 1
          fi
          rollback_token="${rollback_tokens[0]}"
          [[ "$rollback_token" =~ ^[A-Za-z0-9._~+/=-]{16,512}$ ]] || { echo '::error::VPS returned a malformed rollback token.'; exit 1; }
          printf '::add-mask::%s\n' "$rollback_token"
          unset rollback_tokens

          verify_endpoints() {
            curl --fail --silent --show-error --output /dev/null --connect-timeout 10 --max-time 30 --retry 6 --retry-all-errors --retry-delay 5 "https://${VPS_HOST}/health" || return 1
            curl --fail --silent --show-error --output /dev/null --connect-timeout 10 --max-time 30 --retry 6 --retry-all-errors --retry-delay 5 "https://${VPS_HOST}/health/ready" || return 1
          }
          if ! verify_endpoints; then
            echo '::error::Public HTTPS health/readiness failed; requesting token-protected rollback only if this exact release is still current.'
            if rollback_output="$(ssh -i "$HOME/.ssh/global_deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$VPS_SSH_PORT" "$VPS_USER@$VPS_HOST" rollback-if-current "$RELEASE_VERSION" "$rollback_token" 2>&1)"; then
              unset rollback_output rollback_token
              echo '::error::Conditional rollback command succeeded. The deployment job remains failed as required.'
            else
              unset rollback_output rollback_token
              echo '::error::Conditional rollback failed or was rejected; inspect VPS release state before retrying.'
            fi
            exit 1
          fi
          unset rollback_token
          echo 'Deployment and public HTTPS health/readiness checks succeeded.'
